[package]
name = "langx"
version = "0.3.0"
edition = "2021"
authors = ["Noah Sadat <mail@sadat.info>"]
description = "LangX - A programming language that interprets structured English"

[dependencies]
logos = "0.13.0"      # For lexical analysis
lalrpop-util = "0.20.0"  # Runtime support for the LALRPOP parser
regex = "1.9.1"       # Used by LALRPOP and logos
rustyline = "11.0"    # For REPL with command history
chrono = "0.4"        # For time and date handling

[build-dependencies]
lalrpop = "0.20.0"    # Parser generator

[dev-dependencies]
pretty_assertions = "1.4.0"  # For better test assertions
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5.0"  # Property-based testing for fuzzing

[[bench]]
name = "lexer_bench"
harness = false

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "interpreter_bench"
harness = false
